# Configuración base de [ES][MRP] Argentea Station.
# Se carga con config.presets = "Argentea/argentea" en server_config.toml.
# Los valores de server_config.toml tienen prioridad sobre los de este archivo.

[game]
hostname         = "[ES][MRP] Argentea Station"
desc             = "Servidor latino de Space Station 14 en español. Rol medio (MRP). Basado en Starlight: https://github.com/ss14Starlight/space-station-14"
lobbyenabled     = true
lobbyduration    = 60 # 1 minuto de lobby
soft_max_players = 40
map_pool         = "ArgenteaMapPool" # Resources/Prototypes/_Argentea/Maps/Pools/argentea.yml
# Tiempos de rol divididos por 4 salvo comando (Resources/Prototypes/_Argentea/Roles/requirement_overrides.yml).
role_timer_override = "Argentea"

[hub]
# Desactivado mientras el servidor sea solo local. Activar al abrirlo al público.
advertise = false
tags      = "lang:es,rp:med"
